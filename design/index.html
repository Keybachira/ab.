<!doctype html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ab-armazem</title>
<meta name="description" content="Cofre central dos meus projectos.">
<meta name="theme-color" content="#1E1E1E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script>
/* Aplica o tema antes de pintar, para não haver flash. */
try {
  var t = localStorage.getItem('ab-theme');
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
} catch (e) {}
</script>
<style>
:root{
  --bg:#1E1E1E; --surface:#262626; --line:#3A3A38; --muted:#9A978F; --fg:#ECE9E2;
  --accent:#D4FF3F; --ink:#1E1E1E; --amber:#E0A84B; --grain:0.35;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme="light"]{
  --bg:#F1EFE9; --surface:#E8E5DD; --line:#CFCAC0; --muted:#5F5B54; --fg:#1E1E1E;
  --accent:#44580A; --ink:#F1EFE9; --amber:#9A6A12; --grain:0.2;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.lab{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 10px;border-radius:999px;background:var(--surface);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.sdot{width:7px;height:7px;border-radius:999px;display:inline-block;flex:none}
.box{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;cursor:pointer;transition:background .12s linear}
.box:hover{background:var(--line)}

/* ---------- Palco: a página nunca faz scroll ---------- */
.stage{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden;--px:0;--py:0}

/* HUD minúsculo */
.hud{position:absolute;top:6px;left:24px;z-index:30;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.hud .pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:4px;background:color-mix(in srgb,var(--surface) 80%,transparent);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em}
.hud .k{color:var(--muted)}
.hud b{font-weight:500;color:var(--fg)}

/* Cabeçalho */
.top{position:absolute;top:20px;left:24px;right:24px;z-index:30;height:46px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.logo{display:inline-flex;gap:3px;text-decoration:none;justify-self:start}
.logo span{width:28px;height:28px;border:1.5px solid var(--fg);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.top-mid{display:flex;align-items:center;gap:6px;justify-self:center}
.nav{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--surface) 85%,transparent)}
.nav a{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:6px;color:var(--fg);font-size:15px;font-weight:500;text-decoration:none;transition:background .12s linear}
.nav a:hover,.nav a[aria-current="page"]{background:var(--line)}
.top-mid .box{height:42px;border-radius:8px;font-family:var(--mono)}
.top-end{display:flex;align-items:center;gap:6px;justify-self:end}
.top-end .box{height:40px;min-width:40px;padding:0;border-radius:8px}
.theme{display:flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.theme button{width:34px;height:34px;border:0;border-radius:6px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--line);color:var(--fg)}

/* ---------- Anel: plataformas à esquerda, azulejos à direita ---------- */
.item{position:absolute;left:0;top:0;margin:0;padding:0;border:0;background:none;cursor:pointer;will-change:transform,opacity,filter}
.plate{width:var(--iw);height:var(--ih)}
.tile{width:var(--tw);height:var(--tw)}

.art{position:absolute;inset:0;display:block;overflow:hidden;-webkit-clip-path:url(#pillow);clip-path:url(#pillow);
  transform:perspective(1200px) rotateY(calc(var(--px) * 4deg)) rotateX(calc(var(--py) * -3deg));transition:transform .3s ease-out,filter .2s linear}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 50% 50%,transparent 58%,rgba(0,0,0,.38)),linear-gradient(180deg,rgba(255,255,255,.07),transparent 30%)}
.hatch{position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,transparent 1px 14px)}
.gl{position:absolute;left:6%;bottom:5%;font-size:calc(var(--iw) * .17);line-height:1;font-weight:600;letter-spacing:-.05em;color:rgba(255,255,255,.88);mix-blend-mode:overlay}
.item:hover .art{filter:brightness(1.08)}

.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  border-radius:calc(var(--tw) * .06);border:calc(var(--tw) * .03) solid transparent;
  background:linear-gradient(160deg,#151515,#050505) padding-box,conic-gradient(from 200deg,#d8d8d8,#6d6d6d,#f2f2f2,#8aa0a8,#e9e9e9,#5b5b5b,#d8d8d8) border-box;
  box-shadow:4px 5px 0 #0b0b0b,8px 10px 0 #181818,0 34px 50px rgba(0,0,0,.45);
  transition:filter .2s linear}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 38%,transparent 70%,rgba(255,255,255,.06))}
.face img{width:62%;height:62%;object-fit:contain}
.mg{font-size:calc(var(--tw) * .34);line-height:1;font-weight:600;letter-spacing:-.05em;background:linear-gradient(135deg,hsl(var(--h1) 95% 72%),hsl(var(--h2) 95% 58%));-webkit-background-clip:text;background-clip:text;color:transparent}
.item:hover .face{filter:brightness(1.15)}

/* ---------- Centro: número, nome, tags, botão ---------- */
.center{position:absolute;left:0;top:0;width:0;height:0;z-index:8}
.ci{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:max-content;max-width:min(26vw,360px)}
.ci .lab{font-size:11px}
.title{margin:0;font-size:clamp(28px,1.9vw,44px);line-height:1.05;letter-spacing:-.035em;font-weight:600;overflow-wrap:anywhere}
.ctags{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.meta{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);flex-wrap:wrap;justify-content:center}
.view{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:6px;background:var(--surface);font-size:14px;font-weight:500;text-decoration:none;transition:background .12s linear,transform .12s linear}
.view:hover{background:var(--line);transform:translateY(-1px)}
.in{animation:swapIn .5s cubic-bezier(.2,.8,.2,1) both}
.out{animation:swapOut .25s ease-in both;pointer-events:none}
@keyframes swapIn{from{opacity:0;transform:translate(-50%,-50%) translateY(18px);filter:blur(6px)}to{opacity:1;transform:translate(-50%,-50%);filter:none}}
@keyframes swapOut{to{opacity:0;transform:translate(-50%,-50%) translateY(-18px);filter:blur(6px)}}

/* ---------- Presença: cursores e toast ---------- */
.cursors{position:absolute;inset:0;z-index:40;pointer-events:none}
.cur{position:absolute;left:0;top:0;will-change:transform;opacity:0;transition:opacity .2s linear}
.cur.on{opacity:1}
.cur svg{display:block}
.cur span{position:absolute;left:16px;top:20px;white-space:nowrap;height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:3px;font-family:var(--mono);font-size:11px;color:#1b1b1b}
.toast{position:absolute;left:24px;bottom:24px;z-index:35;width:320px;max-width:calc(100vw - 48px);padding:12px 16px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;background:var(--surface);animation:swapUp .3s cubic-bezier(.2,.8,.2,1) both}
.toast[hidden]{display:none}
.toast.bye{animation:fadeOut .25s linear both}
.toast .sdot{margin-top:6px;background:var(--muted)}
.toast .t{display:flex;flex-direction:column;gap:2px}
.toast b{font-size:14px;font-weight:600}
.toast i{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--muted)}
@keyframes swapUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0}}

.hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;font-size:11px;white-space:nowrap;transition:opacity .6s linear;pointer-events:none}
.hint.gone{opacity:0}

/* Online agora: linha no centro e barra por projecto */
.live{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--accent)}
.live:empty{display:none}
.live.zero{color:var(--muted)}
.livebar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;max-width:min(620px,86vw)}
.livebar[hidden]{display:none}
.lb{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;border:0;border-radius:999px;background:var(--surface);font-family:var(--mono);font-size:11px;letter-spacing:.04em;cursor:pointer;transition:background .12s linear}
.lb b{font-weight:500;color:var(--accent)}
.lb:hover{background:var(--line)}
kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg)}

/* ---------- Paleta ⌘K ---------- */
.pal{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:14vh 16px 16px;background:rgba(0,0,0,.55)}
.pal[hidden]{display:none}
.panel{width:min(640px,100%);border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;animation:pop .18s cubic-bezier(.2,1.2,.4,1) both}
.panel input{width:100%;height:56px;padding:0 20px;border:0;border-bottom:1px solid var(--line);outline:0;background:transparent;color:var(--fg);font-family:var(--sans);font-size:17px}
.panel input::placeholder{color:var(--muted);opacity:1}
.panel ul{list-style:none;margin:0;padding:8px;max-height:min(50vh,420px);overflow-y:auto}
.panel .grp{padding:12px 12px 6px}
.panel li[role="option"]{height:44px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-radius:8px;font-size:16px;cursor:pointer}
.panel li[aria-selected="true"]{background:var(--line)}
.panel .pf{display:flex;gap:20px;padding:12px 20px;border-top:1px solid var(--line)}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

/* ---------- Grão ---------- */
.grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:overlay;opacity:var(--grain);z-index:400}

@media (max-width:900px){
  .hud{left:16px;right:16px}
  .hud .pill:nth-child(n+4){display:none}
  .top{top:34px;left:16px;right:16px;grid-template-columns:auto 1fr auto}
  .top-mid .nav{display:none}
  .top-mid{justify-self:end}
  .top-end .box[aria-label="Notificações"]{display:none}
  .ci{max-width:84vw}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <!-- Forma "almofada": cantos arredondados e arestas ligeiramente curvas, como as capas do site de referência -->
  <clipPath id="pillow" clipPathUnits="objectBoundingBox">
    <path d="M0.045,0.03 Q0.5,-0.02 0.955,0.03 Q0.985,0.04 0.99,0.07 Q1.01,0.5 0.99,0.93 Q0.985,0.96 0.955,0.97 Q0.5,1.02 0.045,0.97 Q0.015,0.96 0.01,0.93 Q-0.01,0.5 0.01,0.07 Q0.015,0.04 0.045,0.03 Z"/>
  </clipPath>
</svg>

<div class="stage" id="stage">

  <div class="hud" aria-label="Estado do sistema">
    <span class="pill"><span class="k">UT::</span><b id="clock">--:--WAT</b></span>
    <span class="pill"><span class="k">FPS::</span><b id="fps">--</b></span>
    <span class="pill" title="Visitantes online agora em todos os projectos"><span class="k">ONLINE::</span><b id="online">1</b></span>
    <span class="pill"><span class="k">LCP::</span><b id="lcp">--</b></span>
    <span class="pill"><span class="k">PRESENÇA::</span><b id="presence">LOCAL</b></span>
    <span class="pill"><span class="k">API::</span><b id="apimode">MOCK</b></span>
  </div>

  <header class="top">
    <a class="logo" href="index.html" aria-label="ab-armazem, início"><span>A</span><span>B</span></a>
    <div class="top-mid">
      <nav class="nav" aria-label="Principal">
        <a href="index.html" aria-current="page">Projectos</a>
        <a href="#">Ideias</a>
        <a href="#">Notas</a>
        <a href="#">Ficheiros</a>
        <a href="#">Cofre</a>
      </nav>
      <button type="button" class="box" id="openPal" aria-label="Abrir paleta de comandos">⌘K</button>
    </div>
    <div class="top-end">
      <button type="button" class="box" aria-label="Notificações">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      </button>
      <div class="theme" role="group" aria-label="Tema">
        <button type="button" id="themeLight" aria-label="Tema claro" aria-pressed="false"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" id="themeDark" aria-label="Tema escuro" aria-pressed="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      </div>
    </div>
  </header>

  <div class="center" id="info" aria-live="polite" aria-label="Projecto activo"></div>
  <div class="cursors" id="cursors" aria-hidden="true"></div>
  <div class="livebar" id="livebar" hidden aria-label="Online agora por projecto"></div>
  <div class="toast" id="toast" hidden role="status"></div>
  <div class="hint lab" id="hint"><kbd>scroll</kbd> ou <kbd>↑</kbd><kbd>↓</kbd> roda &nbsp; <kbd>↵</kbd> abre &nbsp; <kbd>⌘K</kbd> procura</div>
</div>

<div class="pal" id="pal" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Paleta de comandos">
    <input id="palq" type="text" placeholder="Escreve um comando ou procura" autocomplete="off" aria-label="Procurar" role="combobox" aria-expanded="true" aria-controls="pall">
    <ul id="pall" role="listbox" aria-label="Resultados"></ul>
    <div class="pf lab"><span>↑↓ Navegar</span><span>↵ Escolher</span><span>esc Fechar</span></div>
  </div>
</div>

<svg class="grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>

<script>
/* =========================================================
   CONFIGURAÇÃO — edita aqui
   ========================================================= */

/* Dono por omissão (cada projecto pode ter o seu em p.owner). */
const OWNER = { name: '[O teu nome]', handle: '[@o-teu-github]' };

/* Quando o Django estiver pronto, aponta para a API e devolve um array
   com o mesmo formato de MOCK. Vazio = usa os dados de exemplo. */
const API_URL = ''; // ex.: 'http://localhost:8000/api/projects/'

/* Online agora em todos os projectos, em tempo real (ver docs/PRESENCA.md).
   Sem isto a home não mostra números de visitantes (não há valores inventados). */
const PRESENCE_API = ''; // ex.: 'http://localhost:8001/api/presence'

/* Rota do detalhe. No Next.js passa a ser /projectos/[slug]. */
const projectUrl = (p) => 'projecto.html?slug=' + encodeURIComponent(p.slug);

/* Formato de um projecto (o mesmo que o modelo Django vai expor):
   { slug, name, desc, status: 'Activo'|'Pausado'|'Arquivado', year,
     stack: [..], owner: { name },
     cover: 'url da imagem (anel da esquerda). Sem isto gera-se uma capa.',
     logo:  'url do logótipo (azulejo da direita). Sem isto usa-se o monograma.',
     links: [{ label, url }] } */
const MOCK = [
  { slug: 'ab-armazem', name: 'ab-armazem', desc: 'Cofre central dos meus projectos: fichas, links, notas, ficheiros e segredos encriptados.',
    status: 'Activo', year: '2026', stack: ['Next.js', 'Django', 'Neon'], links: [] },
  { slug: 'bachira-hub', name: 'Bachira HUB', desc: 'Analytics hub com SDK próprio. Controlo central para projectos digitais.',
    status: 'Activo', year: '[ANO]', stack: ['SDK', 'Vercel'], links: [{ label: 'Produção', url: 'https://bachira-hub.vercel.app/' }] },
  { slug: 'projecto-03', name: '[Nome do projecto]', desc: '[Descrição curta do projecto.]',
    status: 'Pausado', year: '[ANO]', stack: ['[STACK]'], links: [] },
  { slug: 'projecto-04', name: '[Nome do projecto]', desc: '[Descrição curta do projecto.]',
    status: 'Pausado', year: '[ANO]', stack: ['[STACK]'], links: [] },
  { slug: 'projecto-05', name: '[Nome do projecto]', desc: '[Descrição curta do projecto.]',
    status: 'Arquivado', year: '[ANO]', stack: ['[STACK]'], links: [] }
];

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const mod = (n, m) => ((n % m) + m) % m;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || '');
const norm = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STATUS_COLOR = { 'Activo': 'var(--accent)', 'Pausado': 'var(--amber)', 'Arquivado': 'var(--muted)' };
const stage = $('#stage');

/* Contadores: `live` vem da PRESENCE_API (todos os projectos); `local` são os separadores do cofre. */
const online = { local: 1, localOK: true, live: null, by: Object.create(null) };
function paintOnline() {
  $('#online').textContent = String(online.live !== null ? online.live : online.local);
  $('#presence').textContent = online.live !== null ? 'LIVE' : (online.localOK ? 'LOCAL' : 'OFF');
}
let toastTimer = 0;
function showToast(title, sub) {
  const toast = $('#toast');
  toast.innerHTML = '<span class="sdot"></span><span class="t"><b>' + esc(title) + '</b><i>' + esc(sub) + '</i></span>';
  toast.classList.remove('bye'); toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.add('bye'); setTimeout(() => { toast.hidden = true; toast.classList.remove('bye'); }, 260); }, 3200);
}
function liveInfo(slug) {
  if (online.live === null) return { text: '', zero: false };
  const n = online.by[slug] || 0;
  return { text: n ? '● ' + n + ' online agora' : '● ninguém online', zero: !n };
}

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hues(p) { const h = hash(p.slug || p.name || 'x'); return [h % 360, (h >>> 9) % 360]; }
function monogram(p) {
  const n = String(p.name || '');
  if (n.indexOf('[') !== -1) return '+';
  const w = n.replace(/[^A-Za-zÀ-ÿ0-9\- ]/g, '').split(/[\s\-]+/).filter(Boolean);
  if (!w.length) return '?';
  if (w[0].length <= 2) return w[0].toUpperCase();          /* "ab-armazem" → AB */
  return (w[0][0] + (w[1] ? w[1][0] : (w[0][1] || ''))).toUpperCase(); /* "Bachira HUB" → BH */
}
function coverStyle(p) {
  const [a, b] = hues(p);
  return 'background:radial-gradient(60% 80% at 20% 25%,hsl(' + a + ' 75% 58%) 0,transparent 70%),' +
         'radial-gradient(55% 75% at 80% 75%,hsl(' + b + ' 80% 52%) 0,transparent 70%),' +
         'linear-gradient(135deg,hsl(' + a + ' 45% 16%),hsl(' + b + ' 50% 10%))';
}

/* =========================================================
   HUD: hora de Luanda, FPS e LCP reais
   ========================================================= */
(function hud() {
  const fmt = new Intl.DateTimeFormat('pt-PT', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Africa/Luanda' });
  const clock = $('#clock'), fps = $('#fps'), lcp = $('#lcp');
  const tick = () => { clock.textContent = fmt.format(new Date()) + 'WAT'; };
  tick(); setInterval(tick, 1000);
  let frames = 0, last = performance.now();
  (function loop(now) {
    frames++;
    if (now - last >= 1000) { fps.textContent = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; }
    requestAnimationFrame(loop);
  })(last);
  try {
    new PerformanceObserver((l) => { const e = l.getEntries().pop(); if (e) lcp.textContent = (e.startTime / 1000).toFixed(1) + 's'; })
      .observe({ type: 'largest-contentful-paint', buffered: true });
  } catch (e) {}
})();

/* =========================================================
   TEMA
   ========================================================= */
(function theme() {
  const root = document.documentElement;
  const light = $('#themeLight'), dark = $('#themeDark');
  const meta = $('meta[name="theme-color"]');
  function apply(t) {
    root.setAttribute('data-theme', t);
    light.setAttribute('aria-pressed', String(t === 'light'));
    dark.setAttribute('aria-pressed', String(t === 'dark'));
    meta.setAttribute('content', t === 'light' ? '#F1EFE9' : '#1E1E1E');
    try { localStorage.setItem('ab-theme', t); } catch (e) {}
  }
  light.addEventListener('click', () => apply('light'));
  dark.addEventListener('click', () => apply('dark'));
  apply(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
  window.setTheme = apply;
})();

/* =========================================================
   PRESENÇA: cursores ao vivo entre separadores do mesmo browser.
   É real (BroadcastChannel), não simulada. Para presença entre
   dispositivos, trocar o canal por um WebSocket do Django.
   ========================================================= */
(function presence() {
  const ADJ = ['swift', 'bright', 'quiet', 'keen', 'soft', 'warm', 'spare', 'lucid', 'calm', 'bold'];
  const ANI = ['heron', 'koi', 'wren', 'lynx', 'hare', 'moth', 'fox', 'owl', 'finch', 'otter'];
  const COLORS = ['#B9B66A', '#E8884A', '#5F8FD6', '#A59AD8', '#E8C94A'];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const me = { id: Math.random().toString(36).slice(2, 10), name: pick(ADJ) + ' ' + pick(ANI), color: pick(COLORS) };
  const cursorsEl = $('#cursors');
  const peers = new Map();
  let bc = null, raf = 0, mx = null, my = null, lastSend = 0;

  try { bc = new BroadcastChannel('ab-armazem-presence'); } catch (e) { bc = null; }
  if (!bc) { online.localOK = false; paintOnline(); return; }

  const send = (m) => { try { bc.postMessage(Object.assign({ id: me.id, name: me.name, color: me.color }, m)); } catch (e) {} };
  const count = () => { online.local = peers.size + 1; paintOnline(); };
  /* Com a fonte em tempo real activa, os avisos vêm dela; estes só valem no modo local. */
  const localToast = (t) => { if (online.live === null) showToast(t, (peers.size + 1) + ' online'); };
  const arrow = (c) => '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="1.6" stroke-linejoin="round"><path d="M3 11 21 3l-8 18-2-8z"/></svg>';

  function ensure(m) {
    let c = peers.get(m.id);
    if (!c) {
      const el = document.createElement('div');
      el.className = 'cur';
      el.innerHTML = arrow(m.color) + '<span style="background:' + esc(m.color) + '">' + esc(m.name) + '</span>';
      cursorsEl.appendChild(el);
      c = { id: m.id, name: m.name, el, x: .5, y: .5, tx: .5, ty: .5, seen: Date.now() };
      peers.set(m.id, c); count(); kick();
    }
    c.seen = Date.now();
    return c;
  }
  function drop(id, say) {
    const c = peers.get(id); if (!c) return;
    c.el.remove(); peers.delete(id); count();
    if (say) localToast(c.name + ' saiu');
  }
  function frame() {
    raf = 0;
    const W = innerWidth, H = innerHeight;
    peers.forEach((c) => {
      c.x += (c.tx - c.x) * .25; c.y += (c.ty - c.y) * .25;
      c.el.style.transform = 'translate3d(' + (c.x * W).toFixed(1) + 'px,' + (c.y * H).toFixed(1) + 'px,0)';
    });
    if (peers.size) raf = requestAnimationFrame(frame);
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  bc.onmessage = (ev) => {
    const m = ev.data; if (!m || m.id === me.id) return;
    if (m.t === 'bye') { drop(m.id, true); return; }
    const isNew = !peers.has(m.id);
    const c = ensure(m);
    if (m.t === 'hello') { send({ t: 'here' }); if (isNew) localToast(m.name + ' entrou'); }
    if (m.t === 'pos' && typeof m.x === 'number') { c.tx = m.x; c.ty = m.y; c.el.classList.add('on'); kick(); }
  };
  addEventListener('pointermove', (e) => {
    mx = e.clientX / innerWidth; my = e.clientY / innerHeight;
    const now = performance.now();
    if (now - lastSend > 40) { lastSend = now; send({ t: 'pos', x: mx, y: my }); }
  }, { passive: true });
  setInterval(() => {
    if (mx !== null) send({ t: 'pos', x: mx, y: my });
    const now = Date.now();
    peers.forEach((c, id) => { if (now - c.seen > 8000) drop(id, true); });
  }, 3000);
  addEventListener('pagehide', () => send({ t: 'bye' }));
  send({ t: 'hello' });
})();

/* =========================================================
   ONLINE AGORA em todos os projectos (tempo real)
   Fonte: PRESENCE_API, por Server-Sent Events. Contrato em docs/PRESENCA.md.
   Resposta: { total, projects: { slug: n } }. Sem fonte não há números.
   ========================================================= */
function startLive(projects, onChange) {
  if (!PRESENCE_API) return;
  const base = PRESENCE_API.replace(/\/$/, '');
  const names = Object.create(null);
  projects.forEach((p) => { names[p.slug] = p.name; });
  const copy = (o) => { const r = Object.create(null); for (const k in o) if (Object.prototype.hasOwnProperty.call(o, k)) r[k] = Number(o[k]) || 0; return r; };
  let prev = null;

  function apply(d) {
    if (!d || typeof d.total !== 'number') return;
    const by = copy(d.projects && typeof d.projects === 'object' ? d.projects : {});
    online.live = d.total; online.by = by; paintOnline();
    if (prev) {
      const delta = d.total - prev.total;
      if (delta !== 0) {
        const keys = Object.keys(by).concat(Object.keys(prev.by));
        const changed = keys.filter((k, i) => keys.indexOf(k) === i && (by[k] || 0) !== (prev.by[k] || 0));
        const where = changed.length === 1 ? ' em ' + (names[changed[0]] || changed[0]) : '';
        const n = Math.abs(delta);
        showToast(n + (delta > 0 ? (n === 1 ? ' entrou' : ' entraram') : (n === 1 ? ' saiu' : ' saíram')) + where, d.total + ' online');
      }
    }
    prev = { total: d.total, by: copy(by) };
    onChange();
  }
  function lost() { online.live = null; online.by = Object.create(null); prev = null; paintOnline(); onChange(); }
  function poll() { fetch(base + '/', { headers: { Accept: 'application/json' } }).then((r) => r.json()).then(apply).catch(lost); }

  if ('EventSource' in window) {
    const es = new EventSource(base + '/stream/');
    es.onmessage = (e) => { try { apply(JSON.parse(e.data)); } catch (err) {} };
    es.onerror = lost;                       /* o EventSource volta a ligar sozinho */
  } else { poll(); setInterval(poll, 5000); }
}

/* =========================================================
   DADOS
   ========================================================= */
async function loadProjects() {
  if (!API_URL) return MOCK;
  try {
    const r = await fetch(API_URL, { headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const list = Array.isArray(data) ? data : data.results;
    if (!Array.isArray(list) || !list.length) throw new Error('vazio');
    $('#apimode').textContent = 'LIVE';
    return list;
  } catch (e) {
    console.warn('API indisponível, a usar dados de exemplo:', e);
    return MOCK;
  }
}

/* =========================================================
   ANEL DE PROJECTOS
   ========================================================= */
loadProjects().then(init);

function init(PROJECTS) {
  const N = PROJECTS.length;
  const info = $('#info');

  let target = 0, pos = 0, active = -1, raf = 0, paletteOpen = false;
  let W = 0, H = 0, narrow = false, cyL = 0, cyR = 0, infoX = 0, infoY = 0;
  let cxL = 0, RL = 0, cxR = 0, RR = 0;

  /* ----- Itens: uma plataforma (esquerda) e um azulejo (direita) por projecto ----- */
  const plates = [], tiles = [];
  PROJECTS.forEach((p, i) => {
    const [h1, h2] = hues(p);
    const pl = document.createElement('button');
    pl.type = 'button'; pl.className = 'item plate';
    pl.setAttribute('aria-label', p.name + ', projecto ' + (i + 1) + ' de ' + N);
    pl.innerHTML = '<span class="art">' +
      (safeUrl(p.cover) ? '<img alt="" src="' + esc(p.cover) + '">' : '<span style="position:absolute;inset:0;' + coverStyle(p) + '"></span><i class="hatch"></i><b class="gl">' + esc(monogram(p)) + '</b>') +
      '</span>';
    pl.addEventListener('click', () => { if (i === active) openProject(); else goTo(i); });
    stage.appendChild(pl); plates.push(pl);

    const tl = document.createElement('button');
    tl.type = 'button'; tl.className = 'item tile'; tl.tabIndex = -1;
    tl.setAttribute('aria-hidden', 'true');
    tl.style.setProperty('--h1', h1); tl.style.setProperty('--h2', h2);
    tl.innerHTML = '<span class="face">' + (safeUrl(p.logo) ? '<img alt="" src="' + esc(p.logo) + '">' : '<b class="mg">' + esc(monogram(p)) + '</b>') + '</span>';
    tl.addEventListener('click', () => { if (i === active) openProject(); else goTo(i); });
    stage.appendChild(tl); tiles.push(tl);
  });

  /* ----- Medidas (a geometria do anel vem do tamanho da janela) ----- */
  function measure() {
    W = innerWidth; H = innerHeight; narrow = W < 900;
    let iw, tw;
    if (!narrow) {
      iw = Math.min(W * 0.32, H * 0.68); tw = Math.min(W * 0.11, H * 0.22);
      cyL = cyR = infoY = H * 0.525; infoX = W / 2;
      RL = H * 0.42; cxL = W * 0.215 - RL;       /* anel da esquerda: o centro activo fica a 21,5% da largura */
      RR = H * 0.40; cxR = W * 0.68 + RR;        /* anel da direita: o azulejo activo fica a 68% da largura */
    } else {
      iw = Math.min(W * 0.8, H * 0.40 * 1.78); tw = 0;
      cyL = H * 0.33; infoX = W / 2; infoY = H * 0.68;
      RL = W * 0.62; cxL = W / 2 - RL;
      RR = 1; cxR = 0; cyR = 0;
    }
    stage.style.setProperty('--iw', iw.toFixed(1) + 'px');
    stage.style.setProperty('--ih', (iw / 1.78).toFixed(1) + 'px');
    stage.style.setProperty('--tw', tw.toFixed(1) + 'px');
    info.style.left = infoX + 'px'; info.style.top = infoY + 'px';
  }

  /* ----- Posição de cada item para a posição animada `pos` ----- */
  const A = 69.4 * Math.PI / 180, B = 97.8 * Math.PI / 180;
  function style(el, vis, op, z, blur, tab) {
    el.style.visibility = vis ? 'visible' : 'hidden';
    el.style.pointerEvents = vis ? 'auto' : 'none';
    el.style.opacity = vis ? op.toFixed(3) : '0';
    el.style.zIndex = String(z);
    el.style.filter = blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
    el.tabIndex = tab;
  }
  function layout() {
    const half = N / 2, v = Math.abs(target - pos);
    const blur = reduce ? 0 : Math.min(v * 2.2, 5);
    for (let i = 0; i < N; i++) {
      let d = mod(i - pos, N); if (d > half) d -= N;
      const a = Math.abs(d), c = Math.min(a, 1);
      const op = a <= 1 ? 1 : Math.max(0, 1 - (a - 1) / 0.55);
      const vis = op > 0.01, z = 5 - Math.round(a * 2);

      /* plataforma (esquerda) */
      const ang = d * A, x = cxL + RL * Math.cos(ang), y = cyL + RL * Math.sin(ang);
      const sc = 1 - 0.57 * c, rot = 32 * Math.min(a, 1.25);
      plates[i].style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-50%) rotate(' + rot.toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
      style(plates[i], vis, op, z, blur, a < 1.2 ? 0 : -1);

      /* azulejo (direita) */
      if (narrow) { tiles[i].style.visibility = 'hidden'; tiles[i].style.pointerEvents = 'none'; continue; }
      const ang2 = d * B, x2 = cxR - RR * Math.cos(ang2), y2 = cyR + RR * Math.sin(ang2);
      const sc2 = 1 - 0.07 * c, rot2 = d * 38 - 2 * (1 - c);
      tiles[i].style.transform = 'translate3d(' + x2.toFixed(1) + 'px,' + y2.toFixed(1) + 'px,0) translate(-50%,-50%) rotate(' + rot2.toFixed(1) + 'deg) scale(' + sc2.toFixed(3) + ')';
      style(tiles[i], vis, op, z, blur, -1);
    }
    const idx = mod(Math.round(pos), N);
    if (idx !== active) setActive(idx);
  }

  function frame() {
    const diff = target - pos;
    if (reduce || Math.abs(diff) < 0.001) pos = target; else pos += diff * 0.12;
    layout();
    raf = pos !== target ? requestAnimationFrame(frame) : 0;
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
  function step(dir) { target += dir; kick(); }
  function goTo(i) {
    let d = mod(i - mod(target, N), N);
    if (d > N / 2) d -= N;
    target += d; kick();
  }
  function openProject() { location.href = projectUrl(PROJECTS[active]); }

  /* ----- Centro: número, nome, tags, botão ----- */
  function infoHTML(p, i) {
    const owner = p.owner || OWNER;
    const color = STATUS_COLOR[p.status] || 'var(--muted)';
    const stack = (p.stack || []).join(' · ');
    const li = liveInfo(p.slug);
    return '<div class="lab">N°' + pad(i + 1) + ' / ' + pad(N) + '</div>' +
      '<h1 class="title">' + esc(p.name) + '</h1>' +
      '<div class="ctags"><span class="tag">Dono/' + esc(owner.name) + '</span><span class="tag">' + esc(p.year || '—') + '</span></div>' +
      '<div class="meta"><span class="sdot" style="background:' + color + '"></span>' + esc(p.status) + (stack ? ' · ' + esc(stack) : '') + '</div>' +
      '<div class="live' + (li.zero ? ' zero' : '') + '">' + esc(li.text) + '</div>' +
      '<a class="view" href="' + esc(projectUrl(p)) + '">Ver projecto</a>';
  }
  function setActive(i) {
    active = i;
    plates.forEach((el, k) => el.setAttribute('aria-current', String(k === i)));
    const old = info.firstElementChild;
    if (old) { if (reduce) old.remove(); else { old.classList.add('out'); setTimeout(() => old.remove(), 260); } }
    const el = document.createElement('div');
    el.className = 'ci in'; el.innerHTML = infoHTML(PROJECTS[i], i);
    info.appendChild(el);
  }

  /* ----- Entrada: scroll (rato / trackpad) ----- */
  const hint = $('#hint');
  const hideHint = () => hint.classList.add('gone');
  let acc = 0, cool = 0, accTimer = 0;
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (paletteOpen) return;
    const k = e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? 400 : 1;
    acc += e.deltaY * k;
    clearTimeout(accTimer);
    accTimer = setTimeout(() => { acc = 0; }, 180);
    const now = performance.now();
    if (Math.abs(acc) >= 40 && now > cool) { step(acc > 0 ? 1 : -1); hideHint(); acc = 0; cool = now + 420; }
  }, { passive: false });

  /* ----- Entrada: toque ----- */
  let ty = null, tacc = 0;
  stage.addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; tacc = 0; }, { passive: true });
  stage.addEventListener('touchmove', (e) => {
    if (ty === null || paletteOpen) return;
    const y = e.touches[0].clientY;
    tacc += ty - y; ty = y;
    if (Math.abs(tacc) >= 70) { step(tacc > 0 ? 1 : -1); tacc = 0; }
    e.preventDefault();
  }, { passive: false });
  stage.addEventListener('touchend', () => { ty = null; });

  /* ----- Entrada: teclado ----- */
  window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); togglePalette(); return; }
    if (paletteOpen) return;
    const k = e.key;
    if (k === 'ArrowDown' || k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); step(1); hideHint(); }
    else if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); step(-1); hideHint(); }
    else if (k === 'Home') { e.preventDefault(); goTo(0); }
    else if (k === 'End') { e.preventDefault(); goTo(N - 1); }
    else if (k === 'Enter' && document.activeElement === document.body) { e.preventDefault(); openProject(); }
  });

  /* ----- Paralaxe suave com o rato ----- */
  let pr = 0, ppx = 0, ppy = 0;
  window.addEventListener('pointermove', (e) => {
    ppx = (e.clientX / innerWidth - .5) * 2; ppy = (e.clientY / innerHeight - .5) * 2;
    if (pr || reduce) return;
    pr = requestAnimationFrame(() => { pr = 0; stage.style.setProperty('--px', ppx.toFixed(3)); stage.style.setProperty('--py', ppy.toFixed(3)); });
  }, { passive: true });

  window.addEventListener('resize', () => { measure(); layout(); });

  /* ----- Paleta ⌘K ----- */
  const pal = $('#pal'), palq = $('#palq'), pall = $('#pall');
  let cmds = [], shown = [], sel = 0, lastFocus = null;
  function buildCmds() {
    cmds = PROJECTS.map((p, i) => ({ group: 'Projectos', label: p.name, hint: 'N°' + pad(i + 1), run: () => goTo(i) }));
    cmds.push({ group: 'Acções', label: 'Abrir projecto actual', hint: '↵', run: openProject });
    cmds.push({ group: 'Tema', label: 'Tema claro', hint: '', run: () => window.setTheme('light') });
    cmds.push({ group: 'Tema', label: 'Tema escuro', hint: '', run: () => window.setTheme('dark') });
  }
  function renderPal() {
    const q = norm(palq.value.trim());
    shown = cmds.filter((c) => !q || norm(c.label).includes(q) || norm(c.group).includes(q));
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    let html = '', g = '';
    shown.forEach((c, i) => {
      if (c.group !== g) { g = c.group; html += '<li class="grp lab" role="presentation">' + esc(g) + '</li>'; }
      html += '<li role="option" id="opt' + i + '" data-i="' + i + '" aria-selected="' + (i === sel) + '"><span>' + esc(c.label) + '</span><span class="lab">' + esc(c.hint) + '</span></li>';
    });
    pall.innerHTML = html || '<li class="grp lab" role="presentation">Sem resultados</li>';
    palq.setAttribute('aria-activedescendant', shown.length ? 'opt' + sel : '');
    const s = $('[aria-selected="true"]', pall);
    if (s) s.scrollIntoView({ block: 'nearest' });
  }
  function runSel() { const c = shown[sel]; closePalette(); if (c) c.run(); }
  function openPalette() { lastFocus = document.activeElement; buildCmds(); palq.value = ''; sel = 0; renderPal(); pal.hidden = false; paletteOpen = true; palq.focus(); }
  function closePalette() { pal.hidden = true; paletteOpen = false; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function togglePalette() { paletteOpen ? closePalette() : openPalette(); }

  $('#openPal').addEventListener('click', togglePalette);
  pal.addEventListener('mousedown', (e) => { if (e.target === pal) closePalette(); });
  pall.addEventListener('click', (e) => { const li = e.target.closest('[data-i]'); if (li) { sel = +li.dataset.i; runSel(); } });
  palq.addEventListener('input', () => { sel = 0; renderPal(); });
  palq.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, shown.length - 1); renderPal(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); renderPal(); }
    else if (e.key === 'Enter') { e.preventDefault(); runSel(); }
    else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
  });

  /* ----- Online agora: linha do projecto activo e barra com todos ----- */
  const bar = $('#livebar'), hintEl = $('#hint');
  function paintLive() {
    const el = info.querySelector('.ci:not(.out) .live');
    if (el && active >= 0) { const li = liveInfo(PROJECTS[active].slug); el.textContent = li.text; el.classList.toggle('zero', li.zero); }
    if (online.live === null) { bar.hidden = true; hintEl.style.display = ''; return; }
    hintEl.style.display = 'none';
    const rows = PROJECTS.map((p, i) => ({ i, name: p.name, n: online.by[p.slug] || 0 })).filter((r) => r.n > 0).sort((a, b) => b.n - a.n).slice(0, 5);
    bar.innerHTML = '<span class="lab">Online agora</span>' + (rows.length
      ? rows.map((r) => '<button type="button" class="lb" data-i="' + r.i + '"><span class="sdot" style="background:var(--accent)"></span>' + esc(r.name) + ' <b>' + r.n + '</b></button>').join('')
      : '<span class="lab">ninguém</span>');
    bar.hidden = false;
  }
  bar.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) goTo(+b.dataset.i); });

  /* ----- Arranque ----- */
  measure();
  layout();
  requestAnimationFrame(() => { measure(); layout(); });
  startLive(PROJECTS, paintLive);
}
</script>
